<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>layout-probe</title>
  <style>body{margin:0;background:#000;color:#0f0;font:12px monospace}pre{white-space:pre-wrap}canvas{display:block;margin:0 auto;background:#123}</style>
</head>
<body>
  <pre id="out">running...</pre>
  <canvas id="c"></canvas>
  <script type="module">
    import { Game } from '../src/core/game.js';
    const out = document.getElementById('out');
    const canvas = document.getElementById('c');
    const game = new Game(canvas);
    const r = canvas.getBoundingClientRect();
    out.textContent = [
      'innerWidth=' + window.innerWidth + ' innerHeight=' + window.innerHeight,
      'dpr=' + (window.devicePixelRatio || 1),
      'scale=' + game.scale.toFixed(3),
      'style.width=' + canvas.style.width + ' style.height=' + canvas.style.height,
      'rect=' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height),
      'backing=' + canvas.width + 'x' + canvas.height
    ].join('\n');
  </script>
</body>
</html>
