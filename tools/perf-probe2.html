<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>perf2</title>
  <style>body{margin:0;background:#000;color:#0f0;font:12px monospace}canvas{display:block}pre{white-space:pre-wrap}</style>
</head>
<body>
  <canvas id="c" width="400" height="700"></canvas>
  <pre id="out">running...</pre>
  <script type="module">
    import { Game } from '../src/core/game.js';
    import { LaserPillar } from '../src/entities/laserPillar.js';

    const out = document.getElementById('out');
    const lines = [];
    const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

    const canvas = document.getElementById('c');
    const game = new Game(canvas);
    game.state = 'PLAYING';
    game.score = 20;
    game.drunkMeter = 40;

    const makePillars = (n) => {
      game.pillars.pillars = [];
      for (let i = 0; i < n; i++) {
        game.pillars.pillars.push(new LaserPillar(60 + i * 140, 300 + (i % 2) * 60, 150, 52, { theme: game.currentTheme, tier: 1 }));
      }
    };

    function bench(label, frames, setup) {
      const times = [];
      for (let i = 0; i < frames; i++) {
        if (setup) setup(i);
        const t0 = performance.now();
        game.update(1 / 60);
        game.render();
        times.push(performance.now() - t0);
        game.rocket.y = 350; game.rocket.vy = 0; game.rocket.vx = 0;
        game.state = 'PLAYING';
      }
      times.sort((a, b) => a - b);
      const avg = times.reduce((a, b) => a + b, 0) / times.length;
      log(`${label}: avg=${avg.toFixed(2)}ms p95=${times[Math.floor(times.length * 0.95)].toFixed(1)}ms max=${times[times.length - 1].toFixed(1)}ms`);
    }

    game.pillars.pillars = [];
    game.weather.setWeather('sun', true);
    bench('A no-gates sun', 200);

    makePillars(3);
    bench('B 3-gates sun', 200);

    game.weather.setWeather('rain', true);
    bench('C 3-gates rain', 200);

    game.pillars.pillars = [];
    game.weather.setWeather('sun', true);
    game.story.showChapter(game.currentTheme, true, { lap: 1, chapter: 2 });
    bench('D story-card', 120, () => { game.story.elapsed = 1.0; });

    game.state = 'READY';
    bench('E ready-screen', 120, () => { game.state = 'READY'; });

    game.state = 'PLAYING';
    game.story.phase = 'idle';
    game.perks.isDrafting = true;
    game.perks.draftTimer = 999;
    game.perks.draftCards = [
      { id: 'a', name: 'Lá Sen Che Thân', icon: '🍃', desc: 'Diều nhỏ lại 25% (Hiệu lực: qua 3 cổng)' },
      { id: 'b', name: 'Bọt Rượu Cần', icon: '🫧', desc: 'Khiên bọt đỡ 1 va chạm (Hiệu lực: qua 1 cổng)' },
      { id: 'c', name: 'Xuyên Gió', icon: '👻', desc: 'Tàng hình xuyên cổng 1.8s sau mỗi cú chạm (qua 2 cổng)' }
    ];
    bench('F perk-draft', 120, () => { game.perks.isDrafting = true; });

    // G) Đêm sao + đèn ban đêm
    game.perks.isDrafting = false;
    game.state = 'PLAYING';
    game.story.phase = 'idle';
    game.weather.setWeather('stars', true);
    bench('G stars+lights', 150, () => { game.nightLevel = 1; });

    // H) Chuyển cảnh liên tục (đo đúng lúc đổi chương — trước đây vẽ 2 bức tranh/frame)
    game.weather.setWeather('sun', true);
    makePillars(2);
    bench('H chapter-transition', 240, (i) => {
      if (i % 30 === 0) {
        game.scenic.prevTier = game.scenic.currentTier;
        game.scenic.currentTier = 1 + (i / 30) % 9;
        game.scenic.fadeProgress = 0;
      }
    });

    log('DONE');
  </script>
</body>
</html>
